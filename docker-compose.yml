services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: glow-app

    volumes:
      - .:/var/www
      - vendor:/var/www/vendor

    networks:
      - laravel-network

  nginx:
    image: nginx:latest

    container_name: glox-nginx

    ports:
      - "8080:80"

    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel-network

  db:
    image: mysql:8.4

    container_name: glow-db

    restart: always

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your .env file}

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - laravel-network

networks:
  laravel-network:

volumes:
  mysql-data:
  vendor:
